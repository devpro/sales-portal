# purpose: run Continuous Delivery / Packaging (package)
# actions:
#   - https://github.com/marketplace/actions/checkout
#   - https://github.com/devpro/github-workflow-parts
# images:
#   - https://github.com/actions/runner-images/blob/main/images/ubuntu/Ubuntu2204-Readme.md
# variables:
#   - DOCKERHUB_NAMESPACE
# secrets:
#   - DOCKERHUB_USERNAME
#   - DOCKERHUB_TOKEN

name: PKG

on:
  push:
    branches: ["main"]
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  image-publication:
    name: "Image ${{ matrix.name }}"
    permissions:
      contents: read
      id-token: write
    strategy:
      matrix:
        include:
          - name: Blazor WebAssembly App
            image-name: salesportal-wasmapp
            image-definition: src/BlazorWasmApp/Dockerfile
          - name: CRM Adapter Web API
            image-name: salesportal-crmadapterwebapi
            image-definition: src/CrmAdapterWebApi/Dockerfile
          - name: CRM Data Web API
            image-name: salesportal-crmdatawebapi
            image-definition: src/CrmDataWebApi/Dockerfile
    uses: devpro/github-workflow-parts/.github/workflows/reusable-container-publication.yml@591b0c7bfba6fbc7b0cab7d896447e0732b819de
    with:
      create-latest: ${{ github.ref_name == 'main' }}
      image-definition: ${{ matrix.image-definition }}
      image-name: ${{ matrix.image-name }}
      image-path: docker.io/${{ vars.DOCKERHUB_NAMESPACE }}
      image-platform: linux/amd64
      image-tag: "1.1.${{ github.run_id }}"
      workflow-parts-version: 591b0c7bfba6fbc7b0cab7d896447e0732b819de
    secrets:
      container-registry-password: ${{ secrets.DOCKERHUB_TOKEN }}
      container-registry-username: ${{ secrets.DOCKERHUB_USERNAME }}
