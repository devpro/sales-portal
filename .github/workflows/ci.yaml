# purpose: run Continuous Integration (build, unit test, lint, scan)
# actions:
#   - https://github.com/devpro/github-workflow-parts
# images:
#   - https://github.com/actions/runner-images/blob/main/images/ubuntu/Ubuntu2204-Readme.md
# variables:
#   - DOCKERHUB_NAMESPACE
#   - SONAR_HOST_URL (optional, SonarCloud otherwise)
#   - SONAR_ORG
#   - SONAR_PROJECT_KEY
# secrets:
#   - DOCKERHUB_TOKEN
#   - DOCKERHUB_USERNAME
#   - SONAR_TOKEN

name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch: {}

concurrency:
  group: ${{ github.ref }}-${{ github.workflow }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  build:
    name: Build
    uses: devpro/github-workflow-parts/.github/workflows/reusable-dotnet-quality.yml@13ac7ccf4ba593797f8c80a75f2559ce0fc2d09e
    with:
      dotnet-test-args: --logger trx --collect "XPlat Code Coverage"
      mongodb-enabled: true
      sonar-enabled: ${{ vars.SONAR_ORG != '' }}
      sonar-host-url: ${{ vars.SONAR_HOST_URL || 'https://sonarcloud.io' }}
      sonar-organization: ${{ vars.SONAR_ORG }}
      sonar-project-key: ${{ vars.SONAR_PROJECT_KEY }}
      sonar-project-name: Sales Portal
      workflow-parts-version: 13ac7ccf4ba593797f8c80a75f2559ce0fc2d09e
    secrets:
      sonar-token: ${{ secrets.SONAR_TOKEN }}

  image-scan:
    name: "Image ${{ matrix.name }}"
    strategy:
      matrix:
        include:
          - name: Blazor WebAssembly App
            image-name: salesportal-wasmapp
            image-definition: src/BlazorWasmApp/Dockerfile
          - name: CRM Adapter Web API
            image-name: salesportal-crmadapterwebapi
            image-definition: src/CrmAdapterWebApi/Dockerfile
          - name: CRM Data Web API
            image-name: salesportal-crmdatawebapi
            image-definition: src/CrmDataWebApi/Dockerfile
    uses: devpro/github-workflow-parts/.github/workflows/reusable-container-scan.yml@13ac7ccf4ba593797f8c80a75f2559ce0fc2d09e
    with:
      image-definition: ${{ matrix.image-definition }}
      image-name: ${{ matrix.image-name }}
      image-path: docker.io/${{ vars.DOCKERHUB_NAMESPACE }}
      image-tag: "1.1.${{ github.run_id }}"
      workflow-parts-version: 13ac7ccf4ba593797f8c80a75f2559ce0fc2d09e
