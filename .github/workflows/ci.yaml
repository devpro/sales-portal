# purpose: run Continuous Integration (build, unit test, lint, scan)
# actions:
#   - https://github.com/marketplace/actions/checkout  
#   - https://github.com/marketplace/actions/setup-net-core-sdk
#   - https://github.com/actions/setup-java
#   - https://github.com/marketplace/actions/aqua-security-trivy
#   - https://github.com/marketplace/actions/neuvector-vulnerability-scan-action
# images:
#   - https://github.com/actions/runner-images/blob/main/images/ubuntu/Ubuntu2204-Readme.md
# variables:
#   - DOCKERHUB_NAMESPACE
#   - SONAR_HOST_URL (optional, SonarCloud otherwise)
#   - SONAR_ORG
#   - SONAR_PROJECT_KEY
#   - USE_NEUVECTOR
#   - USE_TRIVY
# secrets:
#   - DOCKERHUB_TOKEN
#   - DOCKERHUB_USERNAME
#   - SONAR_TOKEN

name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch: {}

concurrency:
  group: ${{ github.ref }}-${{ github.workflow }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source code
        uses: actions/checkout@v5
      - name: Install .NET 10.0
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
      - name: Restore .NET packages
        run: dotnet restore
      - name: Lint .NET code
        run: dotnet format --verify-no-changes --severity warn --verbosity:diagnostic
      - name: Install Java 21 # required by Sonar scanner
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'
      - name: Install .NET global tools (Sonar Scanner for .NET)
        run: |
          # The job user is not root, so the tools live in its home and the directory is added to the path of the next steps.
          echo "$HOME/.dotnet/tools" >> "$GITHUB_PATH"
          export PATH="$PATH:$HOME/.dotnet/tools"
          dotnet tool install --global dotnet-sonarscanner
          dotnet tool install --global dotnet-reportgenerator-globaltool
      - name: Install & start MongoDB 8.2
        run: |
          # The runner image has no sudo, so MongoDB comes from its tarball into the temporary directory instead of the apt package.
          mkdir -p "${RUNNER_TEMP}/mongodb/bin" "${RUNNER_TEMP}/mongodb/data"
          curl -fsSL https://fastdl.mongodb.org/linux/mongodb-linux-x86_64-ubuntu2404-8.2.1.tgz |
            tar xz --strip-components=2 -C "${RUNNER_TEMP}/mongodb/bin" --wildcards "*/bin/mongod"
          "${RUNNER_TEMP}/mongodb/bin/mongod" --dbpath "${RUNNER_TEMP}/mongodb/data" --bind_ip 127.0.0.1 \
            --fork --logpath "${RUNNER_TEMP}/mongodb/mongod.log"
      - name: Start code analysis
        if: ${{ env.SONAR_ORG != '' }}
        run: dotnet sonarscanner begin /k:"$SONAR_PROJECT_KEY" /o:"$SONAR_ORG" /n:"Sales Portal" /d:sonar.host.url="$SONAR_HOST_URL" /d:sonar.token="$SONAR_TOKEN" $SONAR_EXTRA_PARAMETERS
      - name: Build .NET solution
        run: dotnet build --no-restore
      - name: Run tests
        run: dotnet test --configuration Debug --no-build --verbosity normal --logger:"junit;LogFilePath=..\..\artifacts\{assembly}-test-result.xml;MethodFormat=Class;FailureBodyFormat=Verbose" --collect:"XPlat Code Coverage"
      - name: Generate test report
        run: |
          reportgenerator "-reports:$DOTNET_TEST_COVERAGE_XMLFILES" -targetdir:$DOTNET_TEST_REPORT_FOLDER "-reporttypes:Cobertura;Html;TextSummary;SonarQube"
          cat $DOTNET_TEST_REPORT_FOLDER/Summary.txt
      - name: Stop code analysis
        if: ${{ env.SONAR_ORG != '' }}
        run: dotnet sonarscanner end /d:sonar.login="$SONAR_TOKEN"
      - name: Stop MongoDB
        if: ${{ always() }}
        run: |
          "${RUNNER_TEMP}/mongodb/bin/mongod" --dbpath "${RUNNER_TEMP}/mongodb/data" --shutdown
    env:
      DOTNET_TEST_COVERAGE_XMLFILES: ./test/*/TestResults/*/coverage.cobertura.xml
      DOTNET_TEST_REPORT_FOLDER: report
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      SONAR_HOST_URL: ${{ vars.SONAR_HOST_URL || 'https://sonarcloud.io' }}
      SONAR_ORG: ${{ vars.SONAR_ORG }}
      SONAR_PROJECT_KEY: ${{ vars.SONAR_PROJECT_KEY }}
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      SONAR_EXTRA_PARAMETERS: /d:sonar.cpd.exclusions=**/*Generated*.cs,report/** /d:sonar.coverageReportPaths=report/SonarQube.xml
  image-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source code
        uses: actions/checkout@v5
      - name: Build front container image
        run: |
          docker build . --file src/BlazorWasmApp/Dockerfile --tag $CONTAINER_REGITRY_DOMAIN/$IMAGE_FOLDER/salesportal-wasmapp:${{ env.IMAGE_TAG }}
      - name: Scan front container image with NeuVector
        if: ${{ vars.USE_NEUVECTOR == 'true' }}
        uses: neuvector/scan-action@main
        with:
          image-repository: ${{ env.CONTAINER_REGITRY_DOMAIN }}/${{ env.IMAGE_FOLDER }}/salesportal-wasmapp
          image-tag: ${{ env.IMAGE_TAG }}
          min-high-cves-to-fail: "1"
          min-medium-cves-to-fail: "1"
      - name: Scan front container image with Trivy
        if: ${{ vars.USE_TRIVY == 'true' }}
        uses: devpro/github-workflow-parts/actions/trivy/scan@defde40cfcaa2dc67c1cc47a27d20605f76d74b0
        with:
          target: '${{ env.CONTAINER_REGITRY_DOMAIN }}/${{ env.IMAGE_FOLDER }}/salesportal-wasmapp:${{ env.IMAGE_TAG }}'
          exit-code: '1'
          ignore-unfixed: 'true'
          pkg-types: 'os,library'
          severity: 'CRITICAL,HIGH'
      - name: Build CRM adapter container image
        run: |
          docker build . --file src/CrmAdapterWebApi/Dockerfile --tag $CONTAINER_REGITRY_DOMAIN/$IMAGE_FOLDER/salesportal-crmadapterwebapi:${{ env.IMAGE_TAG }}
      - name: Scan CRM adapter container image with NeuVector
        if: ${{ vars.USE_NEUVECTOR == 'true' }}
        uses: neuvector/scan-action@main
        with:
          image-repository: ${{ env.CONTAINER_REGITRY_DOMAIN }}/${{ env.IMAGE_FOLDER }}/salesportal-crmadapterwebapi
          image-tag: ${{ env.IMAGE_TAG }}
          min-high-cves-to-fail: "1"
          min-medium-cves-to-fail: "1"
      - name: Scan CRM adapter container image with Trivy
        if: ${{ vars.USE_TRIVY == 'true' }}
        uses: devpro/github-workflow-parts/actions/trivy/scan@defde40cfcaa2dc67c1cc47a27d20605f76d74b0
        with:
          target: '${{ env.CONTAINER_REGITRY_DOMAIN }}/${{ env.IMAGE_FOLDER }}/salesportal-crmadapterwebapi:${{ env.IMAGE_TAG }}'
          exit-code: '1'
          ignore-unfixed: 'true'
          pkg-types: 'os,library'
          severity: 'CRITICAL,HIGH'
      - name: Build CRM data container image
        run: |
          docker build . --file src/CrmDataWebApi/Dockerfile --tag $CONTAINER_REGITRY_DOMAIN/$IMAGE_FOLDER/salesportal-crmdatawebapi:${{ env.IMAGE_TAG }}
      - name: Scan CRM data container image with NeuVector
        if: ${{ vars.USE_NEUVECTOR == 'true' }}
        uses: neuvector/scan-action@main
        with:
          image-repository: ${{ env.CONTAINER_REGITRY_DOMAIN }}/${{ env.IMAGE_FOLDER }}/salesportal-crmdatawebapi
          image-tag: ${{ env.IMAGE_TAG }}
          min-high-cves-to-fail: "1"
          min-medium-cves-to-fail: "1"
      - name: Scan CRM Data container image with Trivy
        if: ${{ vars.USE_TRIVY == 'true' }}
        uses: devpro/github-workflow-parts/actions/trivy/scan@defde40cfcaa2dc67c1cc47a27d20605f76d74b0
        with:
          target: '${{ env.CONTAINER_REGITRY_DOMAIN }}/${{ env.IMAGE_FOLDER }}/salesportal-crmdatawebapi:${{ env.IMAGE_TAG }}'
          exit-code: '1'
          ignore-unfixed: 'true'
          pkg-types: 'os,library'
          severity: 'CRITICAL,HIGH'
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      CONTAINER_REGITRY_DOMAIN: docker.io
      IMAGE_FOLDER: ${{ vars.DOCKERHUB_NAMESPACE }}
      IMAGE_TAG: 1.1.${{ github.run_id }}
